          namespace api_lifecycle_test {
          int run() {
              const wchar_t query[] = {L'?', L'u', L'=', L'x'};
              if (keyauth_detail::bounded_http_query(query, sizeof(query), query, sizeof(query)) != L"?u=x") return 1;
              if (keyauth_detail::bounded_http_query(query + 1, 2 * sizeof(wchar_t), query, sizeof(query)) != L"u=") return 1;
              if (!keyauth_detail::bounded_http_query(nullptr, 0, query, sizeof(query)).empty()) return 1;
              auto rejects = [&](const wchar_t* value, size_t bytes) {
                  try { keyauth_detail::bounded_http_query(value, bytes, query, sizeof(query)); }
                  catch (const std::invalid_argument&) { return true; }
                  return false;
              };
              if (!rejects(nullptr, 2) || !rejects(query, 1) || !rejects(query, sizeof(query) + 2) ||
                  !rejects(query + 4, 2) || !rejects(reinterpret_cast<const wchar_t*>(reinterpret_cast<const char*>(query) + 1), 2)) return 1;
              const wchar_t embedded[] = {L'?', L'\0', L'x'};
              bool rejected = false;
              try { keyauth_detail::bounded_http_query(embedded, sizeof(embedded), embedded, sizeof(embedded)); }
              catch (const std::invalid_argument&) { rejected = true; }
              if (!rejected) return 1;
              if (keyauth_detail::http_reason("login denied") != "login denied" ||
                  keyauth_detail::http_reason(std::string("a\r\n\0b", 5)) != "a   b" ||
                  keyauth_detail::http_reason(std::string(70000, 'x')).size() != USHRT_MAX) return 1;
              std::cout << "Local HTTP query and reason bounds regression tests passed\n";
              if (curl_global_init(CURL_GLOBAL_DEFAULT) != CURLE_OK) return 1;
              const auto transport = curl_version_info(CURLVERSION_NOW);
              if (!transport || transport->version_num < 0x081700 || !transport->libz_version ||
                  std::string(transport->libz_version) != "1.3.2") return 1;
              std::cout << "Linked transport: " << curl_version() << "; sodium: " << sodium_version_string() << "\n";
              KeyAuth::api skipped("skipped", "1234567890", "1.0", "https://keyauth.win/api/1.3/", "");
              skipped.response.success = true;
              skipped.user_data.username = "forged";
              skipped.response.isPaid = true;
              if (skipped.authenticated() || skipped.authenticated(true)) return 1;
              const auto hwid = utils::get_hwid();
              if (hwid.rfind("S-1-", 0) != 0 || utils::get_hwid() != hwid) return 1;
              if (curl_escape(nullptr, "a&+= %") != "a%26%2B%3D%20%25") return 1;
              const std::string binary("a\0b", 3);
              if (curl_escape(nullptr, binary) != "a%00b" || binary != std::string("a\0b", 3)) return 1;
              if (!curl_escape(nullptr, "").empty()) return 1;
              if (get_str_between_two_str("?user=test&token=abc", "&token=", "") != "abc") return 1;
              for (int i = 0; i < 10; ++i) {
                  KeyAuth::api first("first", "1234567890", "1.0", "https://keyauth.win/api/1.3/", "");
                  KeyAuth::api second("second", "0987654321", "1.0", "https://keyauth.win/api/1.3/", "");
                  if (!first.require_signed_downloads) return 1;
                  if (first.max_download_response_bytes != 0) return 1;
                  first.response.success = true;
                  if (first.authenticated() || first.authenticated(true)) return 1;
                  if (!keyauth_detail::auth_window_fresh(10, 10) ||
                      !keyauth_detail::auth_window_fresh(10, 12) ||
                      keyauth_detail::auth_window_fresh(10, 13) ||
                      keyauth_detail::auth_window_fresh(10, 9) ||
                      keyauth_detail::auth_window_fresh(0, 0)) return 1;
              first.enable_secure_strings();
                  if (!first.name.empty()) return 1;
                  first.enable_secure_strings(false);
                  if (first.name != "first" || second.name != "second") return 1;
                  for (size_t length : {size_t(0), size_t(1), size_t(7), size_t(8), size_t(15), size_t(16), size_t(17), size_t(4096)}) {
                      const std::string original(length, '\0');
                      first.name = original;
                      first.path = std::string(length, 'x');
                      first.enable_secure_strings();
                      first.enable_secure_strings();
                      if (!first.name.empty() || !first.path.empty()) return 1;
                      first.enable_secure_strings(false);
                      first.enable_secure_strings(false);
                      if (first.name != original || first.path != std::string(length, 'x')) return 1;
                  }
                  first.stop_ban_monitor();
              }
              std::cout << "API lifecycle and form encoding regression tests passed\n";
              return 0;
          }

