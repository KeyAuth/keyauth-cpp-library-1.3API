                  try { parse_api_endpoint(input); } catch (const std::invalid_argument&) { rejected = true; }
                  require(rejected);
              }
              require(parse_api_endpoint("https://auth.customer.example/api/1.3/").host == "auth.customer.example");
              require(hosts_line_overrides("127.0.0.1\tKEYAUTH.WIN. alias # note", "keyauth.win"));
              require(hosts_line_overrides("::1 alias keyauth.win", "KEYAUTH.WIN."));
              require(hosts_line_overrides("203.0.113.10 other keyauth.win", "keyauth.win"));
              require(!hosts_line_overrides("127.0.0.1 keyauth.win.evil.invalid", "keyauth.win"));
              require(!hosts_line_overrides("# 127.0.0.1 keyauth.win", "keyauth.win"));
              require(!hosts_line_overrides("127.0.0.1 other # keyauth.win", "keyauth.win"));
              require(!hosts_line_overrides("not-an-address keyauth.win", "keyauth.win"));
              for (const auto* ip : {"127.0.0.1", "10.0.0.1", "172.16.0.1", "172.31.255.254",
                  "192.168.1.1", "0.0.0.0", "::", "::1", "fc00::1", "fe80::1", "ff02::1",
                  "::ffff:127.0.0.1", "::ffff:192.168.1.1", "invalid"}) require(private_address(ip));
              for (const auto* ip : {"1.1.1.1", "8.8.8.8", "172.32.0.1", "2606:4700:4700::1111",
                  "::ffff:8.8.8.8"}) require(!private_address(ip));
              require(hostname_matches("api.keyauth.win", "*.keyauth.win"));
              require(hostname_matches("KEYAUTH.WIN.", "keyauth.win"));
              require(!hostname_matches("keyauth.win", "*.keyauth.win"));
              require(!hostname_matches("keyauth.win.evil.invalid", "*.keyauth.win"));
              require(!connection_address_allowed("127.0.0.1", 443, false, true));
              require(!connection_address_allowed("127.0.0.1", 443, false, false));
              require(!connection_address_allowed("::1", 443, false, false));
              require(connection_address_allowed("10.0.0.1", 443, false, false));
              require(!connection_address_allowed("::ffff:127.0.0.1", 443, false, true));
              require(connection_address_allowed("1.1.1.1", 443, false, true));
              require(connection_address_allowed("8.8.8.8", 443, false, true));
              require(connection_address_allowed("127.0.0.1", 8080, true, true));
              require(!connection_address_allowed("1.1.1.1", 80, false, true));
              CURL* curl = curl_easy_init();
              require(curl != nullptr);
              long proxy = 0;
              require(curl_easy_getinfo(curl, CURLINFO_USED_PROXY, &proxy) == CURLE_OK);
              curl_easy_cleanup(curl);
              std::cout << "Hostname and connection policy regression tests passed\n";
              return 0;
          }
