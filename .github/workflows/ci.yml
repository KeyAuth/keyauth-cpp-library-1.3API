          function Assert-ImportTable([byte[]]$image) {
            $pe = [BitConverter]::ToInt32($image, 60)
            $optional = $pe + 24
            $optionalSize = [BitConverter]::ToUInt16($image, $pe + 20)
            if ($optionalSize -lt 216 -or $optional -gt $image.Length - $optionalSize -or [BitConverter]::ToUInt16($image, $optional) -ne 0x20b) { throw 'Invalid x64 optional header.' }
            if ([BitConverter]::ToUInt32($image, $optional + 108) -lt 13) { throw 'Import address directory is missing.' }
            $iat = [uint64][BitConverter]::ToUInt32($image, $optional + 208)
            $size = [uint64][BitConverter]::ToUInt32($image, $optional + 212)
            if ($iat -eq 0 -or $size -lt 8 -or ($iat % 8) -ne 0 -or ($size % 8) -ne 0) { throw 'Invalid import address directory.' }
            $count = [BitConverter]::ToUInt16($image, $pe + 6)
            $table = $optional + $optionalSize
            for ($i = 0; $i -lt $count; $i++) {
              $section = $table + 40 * $i
              $start = [uint64][BitConverter]::ToUInt32($image, $section + 12)
              $length = [uint64][Math]::Max([BitConverter]::ToUInt32($image, $section + 8), [BitConverter]::ToUInt32($image, $section + 16))
              if ($iat -ge $start -and $iat + $size -le $start + $length) {
                $flags = [BitConverter]::ToUInt32($image, $section + 36)
                if (($flags -band 0x40000000) -eq 0 -or ($flags -band 2684354560) -ne 0) { throw 'Import address table must be readable, non-writable and non-executable.' }
                return $section
              }
            }
            throw 'Import address table is outside image sections.'
          }

          function Assert-CodeSections([byte[]]$image) {
            if ($image.Length -lt 64 -or [BitConverter]::ToUInt16($image, 0) -ne 0x5a4d) { throw 'Invalid DOS header.' }
            $pe = [BitConverter]::ToInt32($image, 60)
            if ($pe -lt 64 -or $pe -gt $image.Length - 24 -or [BitConverter]::ToUInt32($image, $pe) -ne 0x4550) { throw 'Invalid PE header.' }
            $count = [BitConverter]::ToUInt16($image, $pe + 6)
            $table = $pe + 24 + [BitConverter]::ToUInt16($image, $pe + 20)
            if ($count -eq 0 -or $table -gt $image.Length - 40 * $count) { throw 'Invalid section table.' }
            $text = -1
            for ($i = 0; $i -lt $count; $i++) {
              $section = $table + 40 * $i
              $name = [Text.Encoding]::ASCII.GetString($image, $section, 8).TrimEnd([char]0)
              $flags = [BitConverter]::ToUInt32($image, $section + 36)
              if (($flags -band 0x20000000) -and ($flags -band 2147483648)) { throw 'Executable section is writable.' }
              if ($name -eq '.text') {
                if (($flags -band 0x60000000) -ne 0x60000000) { throw '.text must be readable and executable.' }
                $text = $section
              }
            }
            if ($text -lt 0) { throw '.text section was not found.' }
            return $text
          }
          $image = [IO.File]::ReadAllBytes($executable)
          $text = Assert-CodeSections $image
          $iatSection = Assert-ImportTable $image
