name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify dependency inputs
        shell: pwsh
        run: |
          $dependencies = @(
            @('curl/libcurl.lib', 'ce95938a2ab28c117c060d0d230627e4394f2816e6bf0278582f4cc16f5252ff', 'https://curl.se/download/curl-8.23.0.zip', '85477fe11408471285f38a601e7c6f53470d13be9a5a316919b071ad02e68213'),
            @('curl/zlib.lib', 'cb8f44532898db105798fcfa2e063ead4b4488ff9806782a8d3d0f410014e8c6', 'https://zlib.net/zlib132.zip', 'e8bf55f3017aa181690990cb58a994e77885da140609fc8f94abe9b65d2cae28'),
            @('libsodium/libsodium.lib', '975fe3ea19d4c78ae8b3ac12fc9212063fea7edadbb6307f089f52febdafa371', 'https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable-msvc.zip', 'ebaa204fdfcedc51dc1ee1bbd03c8d552a14b3372f87f94e44c71a8533f77df4')
          )
          foreach ($dependency in $dependencies) {
            $actual = (Get-FileHash -LiteralPath $dependency[0] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $dependency[1]) { throw "Unexpected dependency binary: $($dependency[0])" }
            Write-Output "Verified $($dependency[0]); upstream archive $($dependency[2]); source SHA256 $($dependency[3])"
          }

      - name: build (release x64)
        shell: pwsh
        run: |
          msbuild .\\library.sln /p:Configuration=Release /p:Platform=x64

      - name: security regression tests
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $compilerEnvironment = & cmd.exe /c "`"$devcmd`" -arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($entry in $compilerEnvironment) {
            if ($entry -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $source = Join-Path $env:RUNNER_TEMP 'security-regression.cpp'
          $testHeader = Join-Path $env:RUNNER_TEMP 'auth-test-access.hpp'
          $headerText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'auth.hpp'))
          $headerText = $headerText.Replace("`tprivate:", "`tprivate:`n        friend struct keyauth_test_access;")
          [IO.File]::WriteAllText($testHeader, $headerText)
          @'
          #define SODIUM_STATIC
          #include "auth-test-access.hpp"
          #include <dpapi.h>
          #include <iostream>
          #include <clocale>
          #include <type_traits>
          #include <cstdlib>
          extern std::string curl_escape(CURL*, const std::string&);
          extern std::string checksum();
          extern std::string get_str_between_two_str(const std::string&, const std::string&, const std::string&);
          namespace KeyAuth {
          struct keyauth_test_access {
              static bool damaged_binding_rejected(api& app) {
                  const auto saved = app.initialized_context_;
                  app.initialized_context_.clear();
                  bool rejected = !app.authenticated() && request_context_rejected(app, app.get_url());
                  app.initialized_context_ = saved;
                  app.initialized_context_[0] ^= 1;
                  rejected = rejected && !app.authenticated() && request_context_rejected(app, app.get_url());
                  app.initialized_context_ = saved;
                  return rejected && app.authenticated();
              }
              static bool request_context_rejected(api& app, const std::string& url) {
                  try { app.req("type=check", url); }
                  catch (const request_error& error) {
                      const std::string message = error.what();
                      return message.find("Application configuration changed") == 0 ||
                          message.find("Request endpoint does not match") == 0;
                  }
                  return false;
              }
              static bool response_paid(api& app, const nlohmann::json& data) {
                  app.load_response_data(data);
                  return app.response.isPaid;
              }
              static bool policy_snapshot_valid(api& app) {
                  std::lock_guard<std::recursive_mutex> lock(app.api_mutex_);
                  if (app.allowed_hosts.size() > 2 || app.pinned_public_keys.size() > 2) return false;
                  for (const auto& host : app.allowed_hosts)
                      if (host != "one.example" && host != "two.example") return false;
                  for (const auto& pin : app.pinned_public_keys)
                      if (pin != "sha256//one" && pin != "sha256//two") return false;
                  return true;
              }
              static void establish(api& app, bool paid, const std::string& expiry) {
                  app.initialized = true;
                  app.bind_initialization_context();
                  app.sessionid = "regression-session";
                  app.user_data.username = "regression-user";
                  app.user_data.subscriptions = {{"default", expiry}};
                  app.response.success = true;
                  app.response.isPaid = paid;
                  app.mark_authenticated();
              }
              static void renew(api& app, bool paid) {
                  app.response.isPaid = paid;
                  app.refresh_auth_runtime();
              }
              static bool rejects_modified_state(api& app) {
                  const auto saved = app.enckey;
                  app.enckey[0] ^= 1;
                  const bool rejected = !app.authenticated();
                  app.enckey = saved;
                  return rejected;
              }
              static bool rejects_modified_key(api& app) {
                  const auto saved = app.auth_seal_key_;
                  app.auth_seal_key_[0] ^= 1;
                  const bool rejected = !app.authenticated();
                  app.auth_seal_key_ = saved;
                  return rejected;
              }
              static bool rejects_copied_state(api& from, api& to) {
                  to.initialized = from.initialized;
                  to.LoggedIn.store(true);
                  to.sessionid = from.sessionid;
                  to.initialized_context_ = from.initialized_context_;
                  to.user_data = from.user_data;
                  to.enckey = from.enckey;
                  to.auth_seal_key_ = from.auth_seal_key_;
                  to.auth_nonce_.store(from.auth_nonce_.load());
                  to.auth_window_.store(from.auth_window_.load());
                  to.auth_seal_.store(from.auth_seal_.load());
                  return !to.authenticated();
              }
              static bool stale_state_can_renew(api& app) {
                  const auto current = keyauth_detail::auth_window_now();
                  const auto stale = current > 3 ? current - 3 : -1;
                  app.auth_window_.store(stale);
                  app.auth_seal_.store(app.compute_auth_seal(app.auth_nonce_.load(), stale));
                  if (app.authenticated() || !app.local_auth_valid(false, false)) return false;
                  renew(app, false);
                  return app.authenticated();
              }
              static bool reset_wipes_state(api& app) {
                  app.reset_auth_runtime();
                  return !app.authenticated() && app.enckey.empty() &&
                      std::all_of(app.auth_seal_key_.begin(), app.auth_seal_key_.end(),
                          [](unsigned char value) { return value == 0; });
              }
          };
          }
          namespace authentication_state_test {
          int run() {
              const auto fail = [](int line) {
                  std::cerr << "Authentication state regression failed at line " << line
                      << "; current window " << keyauth_detail::auth_window_now() << "\n";
                  return 1;
              };
              if (keyauth_detail::auth_window_for_seconds(0) != 1 ||
                  keyauth_detail::auth_window_for_seconds(89) != 1 ||
                  keyauth_detail::auth_window_for_seconds(90) != 2 ||
                  keyauth_detail::auth_window_for_seconds(-1) != 0) return fail(__LINE__);
              using access = KeyAuth::keyauth_test_access;
              KeyAuth::api app("app", "1234567890", "1.0", "https://keyauth.win/api/1.3/", "");
              KeyAuth::api other("app", "1234567890", "1.0", "https://keyauth.win/api/1.3/", "");
              auto role_reply = nlohmann::json::parse(R"({"success":true,"message":"ok"})");
              for (const auto& role : {nlohmann::json(nullptr), nlohmann::json(1), nlohmann::json(true),
                  nlohmann::json::array(), nlohmann::json::object(), nlohmann::json(""),
                  nlohmann::json(" "), nlohmann::json("tester"), nlohmann::json("not_checked")}) {
                  role_reply["role"] = role;
                  if (access::response_paid(app, role_reply)) return fail(__LINE__);
              }
              role_reply["role"] = "premium";
              if (!access::response_paid(app, role_reply)) return fail(__LINE__);
              role_reply["success"] = false;
              if (access::response_paid(app, role_reply)) return fail(__LINE__);
              const auto now = std::chrono::duration_cast<std::chrono::seconds>(
                  std::chrono::system_clock::now().time_since_epoch()).count();
              access::establish(app, false, "1");
              if (!app.authenticated() || app.authenticated(true)) return fail(__LINE__);
              app.response.isPaid = true;
              app.user_data.subscriptions = {{"default", std::to_string(now + 3600)}};
              if (app.authenticated(true)) return fail(__LINE__);
              access::renew(app, false);
              if (app.authenticated(true)) return fail(__LINE__);
              access::renew(app, true);
              if (!app.authenticated(true)) return fail(__LINE__);
              app.response.isPaid = false;
              if (!app.authenticated(true)) return fail(__LINE__);
              if (!access::rejects_modified_state(app) || !access::rejects_modified_key(app)) return fail(__LINE__);
              if (!access::rejects_copied_state(app, other)) return fail(__LINE__);
              access::establish(app, false, std::to_string(now + 3600));
              app.user_data.subscriptions.clear();
              if (!app.authenticated(true)) return fail(__LINE__);
              if (!access::stale_state_can_renew(app) || !app.authenticated(true)) return fail(__LINE__);
              access::establish(app, false, std::to_string(now + 3600) + "invalid");
              if (app.authenticated(true)) return fail(__LINE__);
              app.name = "prefix|suffix";
              access::establish(app, false, "1");
              app.ownerid = "1234567890|prefix";
              app.name = "suffix";
              if (app.authenticated()) return fail(__LINE__);
              app.ownerid = "1234567890";
              app.name = "prefix|suffix";
              if (!app.authenticated()) return fail(__LINE__);
              if (!access::reset_wipes_state(app)) return fail(__LINE__);
              std::thread hosts([&] {
                  for (int i = 0; i < 250; ++i) {
                      app.set_allowed_hosts({"one.example"});
                      app.add_allowed_host("two.example");
                      app.clear_allowed_hosts();
                  }
              });
              std::thread pins([&] {
                  for (int i = 0; i < 250; ++i) {
                      app.set_pinned_public_keys({"sha256//one"});
                      app.add_pinned_public_key("sha256//two");
                      app.clear_pinned_public_keys();
                  }
              });
              for (int i = 0; i < 250; ++i)
                  if (!access::policy_snapshot_valid(app)) std::abort();
              hosts.join();
              pins.join();
              if (!access::policy_snapshot_valid(app)) return fail(__LINE__);
              std::cout << "Authentication state tampering and concurrent policy regression tests passed\n";
              return 0;
          }
          }
          namespace application_binding_test {
          int run() {
              using namespace keyauth_detail;
              using access = KeyAuth::keyauth_test_access;
              const auto fail = [](const char* message) { std::cerr << "Binding regression: " << message << "\n"; return 1; };
              const std::string original = "https://auth.example.invalid/api/1.3/?channel=stable";
              KeyAuth::api app("app", "1234567890", "1.0", original, "");
              access::establish(app, false, "1");
              if (!app.authenticated()) return fail("initial state");
              if (!access::damaged_binding_rejected(app)) return fail("damaged binding");
              app.name = "other";
              if (app.authenticated() || !access::request_context_rejected(app, original)) return fail("app swap");
              app.name = "app";
              app.ownerid = "0987654321";
              if (app.authenticated() || !access::request_context_rejected(app, original)) return fail("owner swap");
              app.ownerid = "1234567890";
              app.url = "https://auth.example.invalid/other/";
              if (app.authenticated() || !access::request_context_rejected(app, app.url)) return fail("path swap");
              app.url = original;
              if (!access::request_context_rejected(app, "https://other.example.invalid/api/1.3/")) return fail("request redirect");
              app.url = "HTTPS://AUTH.EXAMPLE.INVALID.:443/api/1.3/?channel=stable";
              if (!app.authenticated()) return fail("equivalent URL");
              app.enable_secure_strings();
              if (!app.authenticated()) return fail("protected settings");
              app.enable_secure_strings(false);
              if (!app.authenticated()) return fail("restored settings");
              const auto base = parse_api_endpoint(original).url;
              if (!request_endpoint_matches(base, base, "login") ||
                  !request_endpoint_matches(base, base + "&check_paid=1", "check") ||
                  request_endpoint_matches(base, base + "&check_paid=1", "login") ||
                  request_endpoint_matches(base, base + "&appname=other", "check")) return fail("query handling");
              const auto plain = parse_api_endpoint("https://auth.example.invalid/api/1.3/").url;
              if (!request_endpoint_matches(plain, plain + "?check_paid=1", "check")) return fail("plain paid query");
              auto reply = nlohmann::json::parse(R"({"success":true,"ownerid":"owner","appname":"app","sessionid":"session"})");
              validate_response_context(reply, "owner", "app", "session", "login");
              validate_response_context(nlohmann::json::parse(R"({"success":true})"), "owner", "app", "session", "login");
              for (const char* field : {"ownerid", "appname", "sessionid"}) {
                  for (const auto& invalid : {nlohmann::json("other"), nlohmann::json(1), nlohmann::json(nullptr)}) {
                      auto changed = reply;
                      changed[field] = invalid;
                      bool rejected = false;
                      try { validate_response_context(changed, "owner", "app", "session", "login"); }
                      catch (const std::invalid_argument&) { rejected = true; }
                      if (!rejected) return fail("response swap or invalid identifier");
                  }
              }
              reply["sessionid"] = "new-session";
              validate_response_context(reply, "owner", "app", "", "init");
              reply["sessionid"] = "";
              validate_response_context(reply, "owner", "app", "session", "logout");
              bool rejected = false;
              try { validate_response_context(reply, "owner", "app", "", "init"); }
              catch (const std::invalid_argument&) { rejected = true; }
              if (!rejected) return fail("empty initialization session");
              validate_response_context(nlohmann::json::parse(R"({"success":false,"sessionid":null,"appname":null})"),
                  "owner", "app", "session", "check");
              std::cout << "Application identity and signed response context regression tests passed\n";
              return 0;
          }
          }
          namespace string_lifetime_test {
          int run() {
              constexpr auto literal = XorStr("compile-time");
              static_assert(sizeof(literal) > 0, "String wrapper must remain a literal type.");
              const auto check = [](auto wrapped, const auto& expected) {
                  using String = std::decay_t<decltype(expected)>;
                  static_assert(std::is_standard_layout_v<decltype(wrapped)>);
                  const size_t bytes = (expected.size() + 1) * sizeof(typename String::value_type);
                  std::vector<unsigned char> before(bytes);
                  std::memcpy(before.data(), &wrapped, bytes);
                  if (wrapped.str() != expected || std::memcmp(before.data(), &wrapped, bytes) != 0) return false;
                  const auto* view = wrapped.c_str();
                  if (String(view) != expected || wrapped.str() != expected || String(view) != expected) return false;
                  return true;
              };
              if (!check(XorStr("temporary-secret-marker"), std::string("temporary-secret-marker")) ||
                  !check(XorStr(L"wide-marker"), std::wstring(L"wide-marker")) ||
                  !check(XorStr(u"utf16-marker"), std::u16string(u"utf16-marker")) ||
                  !check(XorStr(U"utf32-marker"), std::u32string(U"utf32-marker")) ||
                  !check(XorStr(""), std::string())) return 1;
              auto first = XorStr<sizeof("same"), 1>("same");
              auto second = XorStr<sizeof("same"), 2>("same");
              if (!(first == second) || !(std::string("same") == first) ||
                  (first + second) != "samesame" || (std::string("x") + first) != "xsame") return 1;
              std::ostringstream stream;
              stream << first;
              if (stream.str() != "same") return 1;
              std::cout << "String conversion plaintext lifetime regression tests passed\n";
              return 0;
          }
          }
          namespace local_data_test {
          int run() {
              using KeyAuth::api;
              std::string binary;
              for (int i = 0; i < 256; ++i) binary.push_back(static_cast<char>(i));
              for (const auto& plain : {std::string(), std::string("saved-passphrase"), binary}) {
                  const auto protected_value = api::protect_data(plain);
                  if (protected_value.rfind("keyauth:dpapi:v1:", 0) != 0 ||
                      api::unprotect_data(protected_value) != plain) return 1;
              }
              const auto protected_value = api::protect_data("secret");
              for (const auto& invalid : {std::string("plaintext"), std::string("keyauth:dpapi:v2:00"),
                  protected_value + "z", protected_value.substr(0, protected_value.size() - 2)}) {
                  bool rejected = false;
                  try { api::unprotect_data(invalid); } catch (const KeyAuth::request_error&) { rejected = true; }
                  if (!rejected) return 1;
              }
              std::string malformed = std::string("KA-DATA1payload") + std::string(crypto_generichash_BYTES, '\0');
              DATA_BLOB input{static_cast<DWORD>(malformed.size()), reinterpret_cast<BYTE*>(malformed.data())};
              DATA_BLOB output{};
              if (!CryptProtectData(&input, nullptr, nullptr, nullptr, nullptr, CRYPTPROTECT_UI_FORBIDDEN, &output)) return 1;
              std::string encoded("keyauth:dpapi:v1:");
              const char hex[] = "0123456789abcdef";
              for (DWORD i = 0; i < output.cbData; ++i) {
                  encoded.push_back(hex[output.pbData[i] >> 4]);
                  encoded.push_back(hex[output.pbData[i] & 15]);
              }
              SecureZeroMemory(output.pbData, output.cbData);
              LocalFree(output.pbData);
              bool rejected = false;
              try { api::unprotect_data(encoded); } catch (const KeyAuth::request_error&) { rejected = true; }
              if (!rejected) return 1;
              std::cout << "Account-bound local data encryption regression tests passed\n";
              return 0;
          }
          }
          namespace response_headers_test {

          static void require(bool condition) {
              if (!condition) std::abort();
          }
          int run() {
              const int previous_mode = _configthreadlocale(_ENABLE_PER_THREAD_LOCALE);
              const std::string previous_locale = std::setlocale(LC_CTYPE, nullptr);
              for (const char* locale : {"C", "tr-TR", "ja-JP", "zh-CN", "pt-BR"}) {
                  if (!std::setlocale(LC_CTYPE, locale)) return 1;
                  keyauth_detail::SignatureHeaders localized;
                  keyauth_detail::consume_header(localized, "X-SIGNATURE-ED25519: valid\r\n");
                  keyauth_detail::consume_header(localized, "X-SIGNATURE-TIMESTAMP: 1770000000\r\n");
                  if (localized.signature != "valid" || localized.timestamp != "1770000000") return 1;
                  if (keyauth_detail::ascii_lower('I') != 'i') return 1;
              }
              std::setlocale(LC_CTYPE, previous_locale.c_str());
              _configthreadlocale(previous_mode);
              keyauth_detail::SignatureHeaders h;
              using keyauth_detail::consume_header;
              consume_header(h, "HTTP/1.1 200 Connection established\r\n");
              consume_header(h, "X-Signature-Ed25519: stale\r\n");
              consume_header(h, "HTTP/2 200\r\n");
              require(h.signature.empty() && h.timestamp.empty());
              consume_header(h, "X-SIGNATURE-ED25519:\tvalid \t\r\n");
              consume_header(h, "x-signature-timestamp: 1770000000\r\n");
              require(h.signature == "valid" && h.timestamp == "1770000000");
              require(h.timestamp_received_at > 0);
              const auto observed_at = h.timestamp_received_at;
              consume_header(h, "x-signature-timestamp: 1770000000\r\n");
              require(h.timestamp_received_at == observed_at);
              consume_header(h, "x-signature-ed25519: valid\r\n");
              require(!h.conflicting);
              consume_header(h, "x-signature-ed25519: other\r\n");
              require(h.conflicting);
              consume_header(h, "HTTP/1.1 103 Early Hints\r\n");
              require(!h.conflicting && h.signature.empty());
              consume_header(h, "x-signature-ed25519: \r\n");
              consume_header(h, "x-signature-ed25519: interim\r\n");
              require(h.conflicting);
              consume_header(h, "HTTP/2 200\r\n");
              require(!h.signature_seen && !h.timestamp_seen && !h.conflicting);
              consume_header(h, "x-signature-timestamp: \r\n");
              consume_header(h, "x-signature-timestamp: 1770000000\r\n");
              require(h.conflicting);
              consume_header(h, "HTTP/2 200\r\n");
              consume_header(h, "x-signature-ed25519: same\r\n");
              consume_header(h, "x-signature-ed25519: \r\n");
              require(h.conflicting);
              consume_header(h, "HTTP/2 200\r\n");
              consume_header(h, "x-signature-timestamp: 1770000000\r\n");
              consume_header(h, "x-signature-timestamp: 1770000000\r\n");
              require(!h.conflicting);
              consume_header(h, "HTTP/2 200\r\n");
              consume_header(h, "x-signature-ed25519: interim\r\n");
              consume_header(h, "HTTP/1.1 503 Service Unavailable\r\n");
              require(h.signature.empty());
              consume_header(h, "server: edge\r\n");
              consume_header(h, "\r\n");
              require(h.signature.empty());
              std::cout << "Response header regression tests passed\n";
              return 0;
          }

          }

          namespace payload_verifier_test {

          static void require(bool condition) { if (!condition) std::abort(); }
          static std::string hex(const unsigned char* bytes, size_t size) {
              std::string out(size * 2 + 1, '\0');
              sodium_bin2hex(out.data(), out.size(), bytes, size);
              out.pop_back();
              return out;
          }
          int run() {
              using namespace keyauth_detail;
              require(sodium_init() >= 0);
              unsigned char pk[crypto_sign_PUBLICKEYBYTES], sk[crypto_sign_SECRETKEYBYTES];
              crypto_sign_keypair(pk, sk);
              const auto key = hex(pk, sizeof(pk));
              const std::string body("{\"success\":true}\0tail", 21);
              auto sign = [&](const std::string& timestamp) {
                  const std::string message = timestamp + body;
                  unsigned char sig[crypto_sign_BYTES];
                  crypto_sign_detached(sig, nullptr,
                      reinterpret_cast<const unsigned char*>(message.data()), message.size(), sk);
                  return hex(sig, sizeof(sig));
              };
              const std::string timestamp = "1770000000";
              const auto signature = sign(timestamp);
              require(verify_payload(signature, timestamp, body, key, 1770000000) == PayloadResult::valid);
              require(verify_payload(signature, timestamp, body + "!", key, 1770000000) == PayloadResult::invalid_signature);
              require(verify_payload(signature, timestamp, body, key, 1770000121) == PayloadResult::timestamp_skew);
              require(verify_payload(signature, timestamp, body, key, 1769999879) == PayloadResult::timestamp_skew);
              require(verify_payload(signature, timestamp, body, key, 1770000120) == PayloadResult::valid);
              require(verify_payload(sign("1770000000123"), "1770000000123", body, key, 1770000000) == PayloadResult::valid);
              require(verify_payload(signature, "1770000000x", body, key, 1770000000) == PayloadResult::timestamp_format);
              require(verify_payload("", timestamp, body, key, 1770000000) == PayloadResult::signature_format);
              require(verify_payload(signature, timestamp, body, "00", 1770000000) == PayloadResult::public_key_format);
              auto damaged = signature; damaged[0] = damaged[0] == '0' ? '1' : '0';
              require(verify_payload(damaged, timestamp, body, key, 1770000000) == PayloadResult::invalid_signature);
              sodium_memzero(sk, sizeof(sk));
              std::cout << "Payload signature regression tests passed\n";
              return 0;
          }

          }

          namespace file_digest_test {
          int run() {
              // Cover Unicode paths without requiring English language packs. -nigel
              const auto directory = std::filesystem::temp_directory_path() /
                  std::filesystem::path(L"keyauth-\u4e2d\u6587-\u65e5\u672c\u8a9e-a\u00e7\u00e3o");
              std::filesystem::create_directories(directory);
              const auto unicode_path = directory / L"\u30c6\u30b9\u30c8-\u00e7.bin";
